[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-finance-data-pipeline"
version = "0.1.0"
description = "Reusable personal finance transaction normalization and export pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "openpyxl>=3.1",
]

[project.scripts]
pf-build-all-transactions = "personal_finance_data_pipeline.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["personal_finance_data_pipeline*"]
